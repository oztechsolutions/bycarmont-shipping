# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b1535f50b1f46743ed77242976f2878d"
name = "BYCShipping"
application_url = "https://bycarmont-shipping-production.up.railway.app/"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobject_definitions,write_metaobjects,write_products,write_shipping,read_orders,read_merchant_managed_fulfillment_orders,read_assigned_fulfillment_orders,read_inventory,read_markets_home"

[auth]
redirect_urls = [ "https://bycarmont-shipping-production.up.railway.app/api/auth" ]
